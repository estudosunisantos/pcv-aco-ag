
name: Testar Algoritmo Genetico

on:
  push:
    branches:
      - graziela-ag

permissions:
  contents: read

jobs:
  testar-ag:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar NumPy
        run: python -m pip install numpy

      - name: Executar Algoritmo Genetico
        run: python -m pcv.algoritmo_genetico

      - name: Validar resultado
        run: python -m pcv.validar_resultado resultados/ag_15_prefeituras.json

      - name: Disponibilizar JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-ag-15-cidades
          path: resultados/ag_15_prefeituras.json
          if-no-files-found: error
